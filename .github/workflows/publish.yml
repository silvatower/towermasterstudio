name: Publish Release

# Manually dispatched. Publishes a pre-built release asset (uploaded to a temporary
# branch) as a GitHub Release. Because the release is created with the built-in
# GITHUB_TOKEN, it is authored by github-actions[bot] — no personal account is attached.
# The zip is stored only as a release asset (permanent, immutable URL for winget), never
# committed to the main tree, so no source and no binaries live in this public repo.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
      asset:
        description: Path (in the dispatched ref) to the zip to publish
        default: TowerMaster-win-x64.zip
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: arc-runner-set
    steps:
      - name: Checkout the dispatched ref (carries the asset)
        uses: actions/checkout@v4

      - name: Create the release (authored by github-actions[bot])
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          name: TowerMaster ${{ inputs.version }}
          body: >-
            TowerMaster — a game-making IDE for the Sega Master System.
            Portable x64 build: unzip anywhere and run TowerMaster.exe.
            Install via winget coming soon: winget install Silvatower.TowerMaster
          files: ${{ inputs.asset }}
